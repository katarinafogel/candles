<!doctype html>
<html lang="ru" class="dark" data-theme="paper" style="color-scheme: light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Гримуар дел: дела, ритуалы и колесо года" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Гримуар" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // The theme before the first paint, the same for all apps (packages/shared/src/themes.ts: savedTheme, applyTheme).
      ;(function () {
        var theme = 'paper'
        try { theme = localStorage.getItem('theme') || theme } catch (e) {}
        var root = document.documentElement
        root.dataset.theme = theme
        root.style.colorScheme = theme === 'night' ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = theme === 'night' ? '#13110f' : '#ffffff'
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@400;500;600;700&family=Shantell+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap&subset=cyrillic" rel="stylesheet" />
    <title>Гримуар дел</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
