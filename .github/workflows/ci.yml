name: CI

# Checks every push, main included: commits now go straight to main, and the deploy workflow only
# runs the app's tests and build, not the database and agent checks.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run --reporter=default --reporter=github-actions
      - run: npm run build

  database:
    # Applies the migrations to an empty Postgres with a stand-in for Supabase auth and checks the access rules.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    defaults:
      run:
        # Shows the SQL error as an annotation on the run, not only in the log.
        shell: bash -o pipefail {0}
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Supabase stand-in (auth schema, roles)
        run: psql -q -v ON_ERROR_STOP=1 -f supabase/tests/supabase_stub.sql 2>&1 | tee out.txt || { grep -m3 -E 'ERROR|FATAL|assert' out.txt | sed 's/^/::error::/'; exit 1; }
      - name: 0001_init
        run: psql -q -v ON_ERROR_STOP=1 -f supabase/migrations/0001_init.sql -f supabase/tests/seed_after_0001.sql 2>&1 | tee out.txt || { grep -m3 -E 'ERROR|FATAL|assert' out.txt | sed 's/^/::error::/'; exit 1; }
      - name: 0002_grimoire
        run: psql -q -v ON_ERROR_STOP=1 -f supabase/migrations/0002_grimoire.sql 2>&1 | tee out.txt || { grep -m3 -E 'ERROR|FATAL|assert' out.txt | sed 's/^/::error::/'; exit 1; }
      - name: 0002_grimoire again (must be safe to re-run)
        run: psql -q -v ON_ERROR_STOP=1 -f supabase/migrations/0002_grimoire.sql 2>&1 | tee out.txt || { grep -m3 -E 'ERROR|FATAL|assert' out.txt | sed 's/^/::error::/'; exit 1; }
      - name: Access rules
        run: psql -q -v ON_ERROR_STOP=1 -f supabase/tests/grimoire_rls.sql 2>&1 | tee out.txt || { grep -m3 -E 'ERROR|FATAL|assert' out.txt | sed 's/^/::error::/'; exit 1; }
      - name: 0003_agent (twice), 0004, 0005
        run: psql -q -v ON_ERROR_STOP=1 -f supabase/migrations/0003_agent.sql -f supabase/migrations/0003_agent.sql -f supabase/migrations/0004_search_path.sql -f supabase/migrations/0005_agent_read.sql 2>&1 | tee out.txt || { grep -m3 -E 'ERROR|FATAL|assert' out.txt | sed 's/^/::error::/'; exit 1; }
      - name: Agent keys
        run: psql -q -v ON_ERROR_STOP=1 -f supabase/tests/agent_keys.sql 2>&1 | tee out.txt || { grep -m3 -E 'ERROR|FATAL|assert' out.txt | sed 's/^/::error::/'; exit 1; }

  agent:
    # The agent's MCP server (Supabase Edge Function on Deno) with the grimoire core copied from src.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Core copy is up to date
        run: node scripts/sync-agent-core.mjs --check
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check
        working-directory: supabase/functions/grimoire-mcp
        run: deno check index.ts server_test.ts
      - name: Tests
        working-directory: supabase/functions/grimoire-mcp
        run: deno test --allow-env
