name: Keep Supabase awake

# Free Supabase projects pause after a week without requests; this pings the database every 3 days.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call ping()
        run: |
          curl --fail --silent --show-error -X POST "${{ vars.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ vars.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
