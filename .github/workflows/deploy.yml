name: Deploy

# The site on Cloudflare Pages (project katarinafogel): the showcase at the root, the workshop at
# /workshop/, the grimoire at /grimoire/ — built together after the tests pass.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Account → Cloudflare Pages → Edit) and
# CLOUDFLARE_ACCOUNT_ID; until they are set the job builds and stops without deploying.
# github.io (katarinafogel.github.io/candles/) is only a forwarding page now: legacy-pages/ sends old
# QR codes, bookmarks and shortcuts to the same pages on katarinafogel.art.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Public project URL and anon key (Settings → Secrets and variables → Actions → Variables).
          # The anon key is meant to be public: access is limited by row-level security in the database.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - id: ready
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::notice::No CLOUDFLARE_API_TOKEN yet: built, not deployed"; echo "go=no" >> "$GITHUB_OUTPUT"; else echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      - if: steps.ready.outputs.go == 'yes'
        name: Make sure the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages project create katarinafogel --production-branch=main || true
      - if: steps.ready.outputs.go == 'yes'
        name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy dist --project-name=katarinafogel --branch=main --commit-dirty=true

  github-io:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: legacy-pages
      - id: deployment
        uses: actions/deploy-pages@v4
